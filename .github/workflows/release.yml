name: Release npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish v${{ inputs.version }}
    if: >-
      github.repository == 'cixiangtao/codex-vscode-project-patch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out the admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install release tooling
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          package_name="$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.name)")"
          package_version="$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.version)")"
          test "$package_name" = "codex-vscode-project-patch"
          test "$package_version" = "$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build and verify package
        run: pnpm release:check

      - name: Resolve verified artifact
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          artifact=".artifacts/codex-vscode-project-patch-${RELEASE_VERSION}.tgz"
          test -f "$artifact"
          test "$(find .artifacts -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')" = "1"
          sha256sum "$artifact" > SHA256SUMS.txt
          printf 'ARTIFACT=%s\n' "$artifact" >> "$GITHUB_ENV"
          printf 'TAG=v%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Create or verify release tag
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Publish package when absent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if npm view "codex-vscode-project-patch@$RELEASE_VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "npm version already exists; skipping publication."
          else
            npm publish "$ARTIFACT" --access public --provenance
          fi

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARTIFACT" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$ARTIFACT" SHA256SUMS.txt \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
